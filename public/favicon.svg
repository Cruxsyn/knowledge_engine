  <line x1="10" y1="10" x2="16" y2="6" stroke="#6366f1" stroke-width="0.5" opacity="0.4"/>
  <line x1="22" y1="10" x2="16" y2="6" stroke="#8b5cf6" stroke-width="0.5" opacity="0.4"/>
</svg>
